name: Publicar no GitHub Pages

# A cada push na main, copia o site e o app para a branch gh-pages,
# que é a fonte do GitHub Pages. A pasta data/ (seus dados) NUNCA é publicada.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar site
        run: |
          mkdir _site
          cp -r index.html styles.css script.js assets app _site/
          touch _site/.nojekyll
      - name: Enviar para a branch gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
